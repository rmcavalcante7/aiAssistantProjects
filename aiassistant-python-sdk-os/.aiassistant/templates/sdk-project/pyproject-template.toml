[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "PACKAGE_NAME"
dynamic = ["version"]
description = "Short SDK description."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "AUTHOR_NAME", email = "AUTHOR_EMAIL" }
]
dependencies = [
  # Add direct runtime dependencies here.
]

[project.optional-dependencies]
dev = [
  "black>=24",
  "mypy>=1.8",
  "pytest>=8",
  "pytest-cov>=5",
  "build>=1",
  "twine>=5"
]
docs = [
  "sphinx>=7",
  "furo>=2024"
]

[project.urls]
Homepage = "https://github.com/OWNER/REPOSITORY"
Documentation = "https://OWNER.github.io/REPOSITORY/"
Repository = "https://github.com/OWNER/REPOSITORY"
Issues = "https://github.com/OWNER/REPOSITORY/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
